# ============================================================
# App BiT — Monorepo Docker Compose
# Servicio: PostgreSQL 15 (Alpine) para entorno de desarrollo local
# ============================================================

version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: appbit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: appbit_user
      POSTGRES_PASSWORD: appbit_password
      POSTGRES_DB: appbit_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appbit_user -d appbit_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: appbit_postgres_data
